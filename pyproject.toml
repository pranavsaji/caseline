[project]
name = "caseline"
version = "0.1.0"
description = "Caseline Phase 0 prototype: AI voice intake agent for law firms (LiveKit Agents + FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "livekit-agents[deepgram,anthropic,cartesia,silero,turn-detector,openai]>=1.0,<2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
