apiVersion: apps/v1
kind: Deployment
metadata:
  name: caseline-api
  labels: { app: caseline-api }
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: caseline-api }
  template:
    metadata:
      labels: { app: caseline-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef: { name: {{ .Values.envFromSecret }} }
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 15
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: caseline-api
spec:
  selector: { app: caseline-api }
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
